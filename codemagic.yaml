workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.knowcarai.app
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sincronizar Capacitor (copia la web y actualiza el proyecto iOS)
        script: |
          npx cap sync ios
      - name: Instalar dependencias de CocoaPods
        script: |
          cd ios/App && pod install
      - name: Configurar la firma automática (certificados de Apple)
        script: |
          xcode-project use-profiles
      - name: Compilar el .ipa
        script: |
          xcode-project build-ipa --workspace "ios/App/$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

  android-workflow:
    name: Android Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - knowcar_keystore
      vars:
        PACKAGE_NAME: "com.knowcarai.app"
      node: latest
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sincronizar Capacitor (copia la web y actualiza el proyecto Android)
        script: |
          npx cap sync android
      - name: Compilar el Android App Bundle
        script: |
          cd android; chmod +x gradlew; ./gradlew bundleRelease
    artifacts:
      - android/app/build/outputs/**/*.aab
